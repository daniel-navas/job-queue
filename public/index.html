<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1024"><title>JobQueue — Opportunities</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><main><header><strong>JobQueue</strong><div class="actions"><button id="searches-open">Searches</button><button id="scan">Find opportunities</button><button id="summarize" class="primary">Process pending</button></div></header><p id="run-status" role="status"></p><p id="ai-status" role="status"></p><p id="error" role="alert"></p>
<section class="toolbar"><nav id="tabs" aria-label="Opportunity status"></nav><input id="search" type="search" placeholder="Search offers or ID…" aria-label="Search opportunities"></section><div class="list-heading"><span id="count"></span><button id="clear-discovery" hidden>Clear search filter</button></div><div class="content"><section id="jobs" aria-label="Opportunities"></section><aside id="detail" aria-label="Opportunity details"></aside></div></main>
<dialog id="reject-dialog"><form id="reject-form"><div class="eyebrow">YOUR FEEDBACK</div><h2>What isn’t a fit?</h2><p id="reject-title"></p><label for="reason">Reason for dismissing</label><textarea id="reason" required maxlength="2000" rows="4" placeholder="For example: too senior, wrong location, not my kind of work…"></textarea><p class="muted">Saved with this offer. This won’t automatically hide similar jobs.</p><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Dismiss opportunity</button></div></form></dialog>
</body></html>
