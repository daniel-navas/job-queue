<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1024"><title>JobQueue — Jobs</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><main><header><strong>JobQueue</strong><nav id="views" aria-label="Workspace"><button data-view="opportunities" aria-pressed="true">Jobs</button><button data-view="applications" aria-pressed="false">Applications</button><button data-view="profile" aria-pressed="false">Profile</button></nav><span id="run-status" role="status"></span><div class="actions"><button id="searches-open">Searches</button><button id="scan">Find jobs</button><button id="summarize" class="primary">Process pending</button></div></header><p id="ai-status" role="status"></p><p id="error" role="alert"></p>
<section class="toolbar"><nav id="tabs" aria-label="Job status"></nav><input id="search" type="search" placeholder="Search jobs or ID…" aria-label="Search jobs"></section><div class="list-heading"><span id="count"></span><button id="clear-discovery" hidden>Clear search filter</button></div><div class="content"><section id="jobs" aria-label="Jobs"></section><aside id="detail" aria-label="Job details"></aside></div></main>
<dialog id="application-dialog"><form id="application-form"><div class="eyebrow">APPLICATION TRACKER</div><h2 id="application-title">Update progress</h2><label for="application-action" id="application-action-label">Update</label><select id="application-action"><option value="add-interview">Add interview</option><option value="outcome">Record outcome</option><option value="submit" hidden>Submit</option><option value="update-submission" hidden>Edit submission</option><option value="update-interview" hidden>Edit interview</option><option value="update-outcome" hidden>Edit outcome</option></select><div id="application-date-field"><label for="application-date">Date</label><input id="application-date" type="date"></div><div id="interview-fields"><label for="interview-name">Interview</label><input id="interview-name" maxlength="100" placeholder="e.g. Technical"><label for="interview-state">Status</label><select id="interview-state"><option value="needs-scheduling">Needs scheduling</option><option value="scheduled">Scheduled</option><option value="completed">Completed</option></select><div id="interview-time-field"><label for="interview-time">Scheduled for</label><input id="interview-time" type="datetime-local"></div></div><div id="outcome-field"><label for="application-outcome">Outcome</label><select id="application-outcome"><option value="rejected">Rejected</option><option value="withdrawn">Withdrawn</option><option value="no-response">No response</option><option value="offer-received">Offer received</option><option value="accepted">Accepted</option></select></div><div id="application-note-field"><label for="application-note">Note (optional)</label><textarea id="application-note" maxlength="2000" rows="3"></textarea></div><p id="application-error" role="alert"></p><div class="actions"><button type="button" id="application-remove" hidden>Remove update</button><button type="button" id="application-cancel">Cancel</button><button type="submit" id="application-save" class="primary">Save update</button></div></form></dialog>
</body></html>
